
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Meeting Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="container mx-auto mt-10 p-6 bg-white rounded shadow-lg">
    <h1 class="text-2xl font-bold mb-4">Meeting Scheduler</h1>
    <a href="/meetings/new" class="bg-blue-500 text-white px-4 py-2 rounded">+ New Meeting</a>
    <table class="w-full mt-4 border-collapse">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-2 border">Title</th>
          <th class="p-2 border">Organizer</th>
          <th class="p-2 border">Time</th>
          <th class="p-2 border">Location</th>
          <th class="p-2 border">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="m : ${meetings}">
          <td th:text="${m.title}" class="border p-2"></td>
          <td th:text="${m.organizer}" class="border p-2"></td>
          <td th:text="${m.startTime} + ' - ' + ${m.endTime}" class="border p-2"></td>
          <td th:text="${m.location}" class="border p-2"></td>
          <td class="border p-2">
            <a th:href="@{'/meetings/edit/' + ${m.id}}" class="text-blue-500">Edit</a> |
            <a th:href="@{'/meetings/delete/' + ${m.id}}" class="text-red-500">Delete</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
