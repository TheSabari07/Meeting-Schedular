<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: #667eea; font-size: 2.5em; }
        .btn { padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: 600; transition: all 0.3s; border: none; cursor: pointer; margin: 0 5px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .legend { background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        .legend-item { display: inline-flex; align-items: center; margin-right: 30px; }
        .legend-color { width: 20px; height: 20px; border-radius: 4px; margin-right: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #ddd; border-radius: 10px; overflow: hidden; }
        .calendar-header { background: #667eea; color: white; padding: 15px; text-align: center; font-weight: 600; }
        .calendar-day { background: white; min-height: 120px; padding: 10px; position: relative; }
        .calendar-day.other-month { background: #f8f9fa; color: #999; }
        .day-number { font-weight: 600; margin-bottom: 5px; }
        .meeting-item { background: #667eea; color: white; padding: 2px 6px; margin: 2px 0; border-radius: 4px; font-size: 0.8em; cursor: pointer; }
        .meeting-item.invited { background: #28a745; }
        .meeting-item:hover { opacity: 0.8; }
        .nav-buttons { text-align: center; margin-bottom: 20px; }
        .month-year { font-size: 1.5em; font-weight: 600; color: #333; margin: 0 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Meeting Calendar</h1>
            <div>
                <a href="/meetings/dashboard" class="btn btn-primary">← Dashboard</a>
                <a href="/meetings" class="btn btn-secondary">List View</a>
            </div>
        </div>
        
        <div class="legend">
            <h3 style="margin-bottom: 15px;">Legend:</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #667eea;"></div>
                <span>Meetings you created</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #28a745;"></div>
                <span>Meetings you're invited to</span>
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="previousMonth()">← Previous</button>
            <span class="month-year" id="monthYear"></span>
            <button class="btn btn-secondary" onclick="nextMonth()">Next →</button>
        </div>
        
        <div class="calendar-grid" id="calendar">
            <div class="calendar-header">Sunday</div>
            <div class="calendar-header">Monday</div>
            <div class="calendar-header">Tuesday</div>
            <div class="calendar-header">Wednesday</div>
            <div class="calendar-header">Thursday</div>
            <div class="calendar-header">Friday</div>
            <div class="calendar-header">Saturday</div>
        </div>
        
        <div th:if="${meetings.empty}" style="text-align: center; padding: 40px; color: #666;">
            <h3>No meetings scheduled</h3>
            <p>Your meetings will appear on the calendar when you create them.</p>
        </div>
    </div>
    
    <script th:inline="javascript">
        const meetings = /*[[${meetings}]]*/ [];
        const currentUserId = /*[[${currentUserId}]]*/ null;
        
        let currentDate = new Date();
        
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthYear').textContent = 
                new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const calendar = document.getElementById('calendar');
            // Clear existing days (keep headers)
            while (calendar.children.length > 7) {
                calendar.removeChild(calendar.lastChild);
            }
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayDiv = createDayDiv(daysInPrevMonth - i, true);
                calendar.appendChild(dayDiv);
            }
            
            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = createDayDiv(day, false);
                const dayMeetings = getMeetingsForDay(year, month, day);
                
                dayMeetings.forEach(meeting => {
                    const meetingDiv = document.createElement('div');
                    meetingDiv.className = 'meeting-item' + (meeting.createdBy.id !== currentUserId ? ' invited' : '');
                    meetingDiv.textContent = meeting.title;
                    meetingDiv.onclick = () => showMeetingDetails(meeting);
                    dayDiv.appendChild(meetingDiv);
                });
                
                calendar.appendChild(dayDiv);
            }
            
            // Next month days
            const totalCells = calendar.children.length - 7;
            const remainingCells = 42 - totalCells;
            for (let day = 1; day <= remainingCells; day++) {
                const dayDiv = createDayDiv(day, true);
                calendar.appendChild(dayDiv);
            }
        }
        
        function createDayDiv(day, isOtherMonth) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day' + (isOtherMonth ? ' other-month' : '');
            
            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            dayDiv.appendChild(dayNumber);
            
            return dayDiv;
        }
        
        function getMeetingsForDay(year, month, day) {
            return meetings.filter(meeting => {
                const meetingDate = new Date(meeting.startTime);
                return meetingDate.getFullYear() === year && 
                       meetingDate.getMonth() === month && 
                       meetingDate.getDate() === day;
            });
        }
        
        function showMeetingDetails(meeting) {
            const startTime = new Date(meeting.startTime).toLocaleString();
            const endTime = meeting.endTime ? new Date(meeting.endTime).toLocaleString() : 'Not specified';
            
            alert(`Meeting Details:\n\n` +
                  `Title: ${meeting.title}\n` +
                  `Organizer: ${meeting.createdBy.fullName}\n` +
                  `Start: ${startTime}\n` +
                  `End: ${endTime}\n` +
                  `Location: ${meeting.location || 'Not specified'}\n` +
                  `Status: ${meeting.status}\n` +
                  `Participants: ${meeting.participants || 'None'}`);
        }
        
        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }
        
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }
        
        // Initialize calendar
        renderCalendar();
    </script>
</body>
</html>
