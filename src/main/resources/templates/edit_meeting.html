<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Meeting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #666; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .btn { background: #667eea; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin: 5px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #764ba2; transform: translateY(-2px); }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .alert { padding: 15px; margin: 20px 0; border-radius: 10px; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Edit Meeting</h1>
        
        <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>
        
        <form th:action="@{/meetings/edit/{id}(id=${meeting.id})}" method="post" th:object="${meeting}">
            <div class="form-group">
                <label for="title">Meeting Title *</label>
                <input type="text" id="title" name="title" th:value="*{title}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" th:text="*{description}"></textarea>
            </div>
            
            <div class="form-group">
                <label for="startTime">Start Date & Time *</label>
                <input type="datetime-local" id="startTime" name="startTime" th:value="*{startTime}" required>
            </div>
            
            <div class="form-group">
                <label for="endTime">End Date & Time *</label>
                <input type="datetime-local" id="endTime" name="endTime" th:value="*{endTime}" required>
            </div>
            
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" th:value="*{location}" placeholder="Meeting room, Zoom link, etc.">
            </div>
            
            <div class="form-group">
                <label for="participants">Participants</label>
                <input type="text" id="participants" name="participants" th:value="*{participants}" placeholder="Email addresses separated by commas">
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <a href="/meetings/dashboard" class="btn btn-secondary">🏠 Home</a>
                <a href="/meetings/dashboard" class="btn btn-secondary">← Cancel</a>
                <button type="submit" class="btn">💾 Update Meeting</button>
            </div>
        </form>
    </div>
</body>
</html>
