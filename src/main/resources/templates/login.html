<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeetSync Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><circle cx="200" cy="200" r="100" fill="%23ffffff10"/><circle cx="800" cy="300" r="150" fill="%23ffffff08"/><circle cx="300" cy="700" r="80" fill="%23ffffff12"/></svg>');
            animation: float 10s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }
        
        .login-container { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px);
            padding: 50px; 
            border-radius: 25px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform-style: preserve-3d;
            position: relative;
            z-index: 10;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 25px 25px 0 0;
        }
        
        h1 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 40px;
            font-size: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .form-group { 
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 10px; 
            color: #666; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group input { 
            width: 100%; 
            padding: 18px 20px; 
            border: 2px solid rgba(224, 224, 224, 0.5); 
            border-radius: 15px; 
            font-size: 16px; 
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .form-group input:focus { 
            outline: none; 
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .btn { 
            width: 100%; 
            background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; 
            padding: 18px; 
            border: none; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover { 
            transform: translateY(-3px) rotateX(5deg); 
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        .signup-link { 
            text-align: center;
            padding: 20px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .signup-link a { 
            color: #667eea; 
            text-decoration: none; 
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .signup-link a:hover { 
            color: #764ba2;
            text-shadow: 0 2px 5px rgba(102, 126, 234, 0.3);
        }
        
        .alert { 
            padding: 18px 25px; 
            margin: 25px 0; 
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        
        .alert-danger { 
            background: rgba(248, 215, 218, 0.9); 
            color: #721c24; 
            border-left: 4px solid #dc3545;
        }
        
        .alert-success { 
            background: rgba(212, 237, 218, 0.9); 
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-home:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 30px 25px; margin: 20px; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    
    <div class="login-container">
        <h1>
            <i class="fas fa-sign-in-alt"></i> Welcome Back
        </h1>
        
        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn">
                <i class="fas fa-rocket"></i> Sign In
            </button>
        </form>
        
        <div class="signup-link">
            <i class="fas fa-user-plus"></i> Don't have an account? 
            <a href="/signup">Create one now</a>
        </div>
    </div>
</body>
</html>
