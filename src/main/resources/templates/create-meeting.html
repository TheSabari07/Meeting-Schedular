<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Meeting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-1/2">
    <h2 class="text-2xl font-bold mb-6">Schedule New Meeting</h2>
    <form th:action="@{/meetings}" th:object="${meeting}" method="post" class="space-y-4">
      <input type="text" th:field="*{title}" placeholder="Title" class="w-full p-2 border rounded"/>
      <input type="text" th:field="*{organizer}" placeholder="Organizer" class="w-full p-2 border rounded"/>
      <input type="text" th:field="*{participants}" placeholder="Participants (comma-separated)" class="w-full p-2 border rounded"/>
      <input type="datetime-local" th:field="*{startTime}" class="w-full p-2 border rounded"/>
      <input type="datetime-local" th:field="*{endTime}" class="w-full p-2 border rounded"/>
      <input type="text" th:field="*{location}" placeholder="Location" class="w-full p-2 border rounded"/>
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Save</button>
      <a href="/meetings" class="text-gray-500 ml-4">Cancel</a>
    </form>
  </div>
</body>
</html>
